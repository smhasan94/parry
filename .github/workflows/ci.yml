name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: parry
          POSTGRES_PASSWORD: parry
          POSTGRES_DB: parry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://parry:parry@localhost:5432/parry_test
      TEST_DATABASE_URL: postgresql+asyncpg://parry:parry@localhost:5432/parry_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: uv run ruff check app/

      - name: Run tests
        working-directory: backend
        run: uv run pytest tests/ -v --ignore=tests/e2e --tb=short -q

  backend-e2e:
    name: Backend E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: parry
          POSTGRES_PASSWORD: parry
          POSTGRES_DB: parry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://parry:parry@localhost:5432/parry_test
      TEST_DATABASE_URL: postgresql+asyncpg://parry:parry@localhost:5432/parry_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]"

      - name: Run E2E tests
        working-directory: backend
        run: uv run pytest tests/e2e/ -v --tb=short -q

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: parry
          POSTGRES_PASSWORD: parry
          POSTGRES_DB: parry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://parry:parry@localhost:5432/parry_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]"

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Verify tables exist
        working-directory: backend
        run: |
          python -c "
          import asyncio, sys
          from sqlalchemy import text, create_engine

          engine = create_engine('postgresql://parry:parry@localhost:5432/parry_test')
          with engine.connect() as conn:
              result = conn.execute(text(\"SELECT tablename FROM pg_tables WHERE schemaname='public'\"))
              tables = {row[0] for row in result}

          expected = {'orgs', 'api_keys', 'agents', 'policies', 'agent_sessions', 'agent_events', 'detections', 'incidents'}
          missing = expected - tables
          if missing:
              print(f'FAIL: Missing tables: {missing}')
              sys.exit(1)
          print(f'OK: All {len(expected)} tables present: {sorted(tables & expected)}')
          "

  sdk:
    name: SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: sdk
        run: uv pip install --system -e ".[dev,openai,anthropic,langchain]"

      - name: Lint
        working-directory: sdk
        run: uv run ruff check parry/

      - name: Run tests
        working-directory: sdk
        run: uv run pytest tests/ -v --tb=short -q

  dashboard:
    name: Dashboard build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Type check + build
        working-directory: dashboard
        run: npm run build

      - name: Run tests
        working-directory: dashboard
        run: npm test
