name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: parry
          POSTGRES_PASSWORD: parry
          POSTGRES_DB: parry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://parry:parry@localhost:5432/parry_test
      TEST_DATABASE_URL: postgresql+asyncpg://parry:parry@localhost:5432/parry_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: uv run ruff check app/

      - name: Run tests
        working-directory: backend
        run: uv run pytest tests/ -v --ignore=tests/e2e --tb=short -q

  backend-e2e:
    name: Backend E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: parry
          POSTGRES_PASSWORD: parry
          POSTGRES_DB: parry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://parry:parry@localhost:5432/parry_test
      TEST_DATABASE_URL: postgresql+asyncpg://parry:parry@localhost:5432/parry_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]"

      - name: Run E2E tests
        working-directory: backend
        run: uv run pytest tests/e2e/ -v --tb=short -q

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: parry
          POSTGRES_PASSWORD: parry
          POSTGRES_DB: parry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://parry:parry@localhost:5432/parry_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]"

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Verify tables exist
        env:
          PGPASSWORD: parry
        run: |
          tables=$(psql -h localhost -U parry -d parry_test -tAc \
            "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename")
          echo "Found tables:"
          echo "$tables"
          for expected in orgs api_keys agents policies agent_sessions agent_events detections incidents audit_log; do
            if ! echo "$tables" | grep -qx "$expected"; then
              echo "FAIL: Missing expected table: $expected"
              exit 1
            fi
          done
          echo "OK: All expected tables present"

      - name: Verify alembic head matches latest migration
        working-directory: backend
        run: |
          current=$(uv run alembic current 2>&1 | grep -oE '[0-9]+ \(head\)' | grep -oE '[0-9]+' || echo "")
          latest=$(ls alembic/versions/[0-9]*.py | sort | tail -1 | grep -oE '[0-9]+_' | tr -d '_')
          echo "Current migration: $current"
          echo "Latest file:       $latest"
          if [ "$current" != "$latest" ]; then
            echo "FAIL: alembic head ($current) does not match latest migration file ($latest)"
            exit 1
          fi
          echo "OK: alembic head matches latest migration"

  sdk:
    name: SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: sdk
        run: uv pip install --system -e ".[dev,openai,anthropic,langchain]"

      - name: Lint
        working-directory: sdk
        run: uv run ruff check parry/

      - name: Run tests
        working-directory: sdk
        run: uv run pytest tests/ -v --tb=short -q

  dashboard:
    name: Dashboard build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Type check + build
        working-directory: dashboard
        run: npm run build

      - name: Run tests
        working-directory: dashboard
        run: npm test

  landing:
    name: Landing site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        working-directory: landing
        run: npm ci

      - name: Build
        working-directory: landing
        run: npm run build

  sdk-ts:
    name: SDK (TypeScript) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk-ts/package-lock.json

      - name: Install dependencies
        working-directory: sdk-ts
        run: npm ci

      - name: Type check
        working-directory: sdk-ts
        run: npm run typecheck

      - name: Build
        working-directory: sdk-ts
        run: npm run build

      - name: Run tests
        working-directory: sdk-ts
        run: npm test

  sdk-go:
    name: SDK (Go) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Vet
        working-directory: sdk-go
        run: go vet ./...

      - name: Run tests
        working-directory: sdk-go
        run: go test ./... -v
