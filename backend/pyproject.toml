[project]
name = "parry-backend"
version = "0.1.0"
description = "Parry — AI Agent Runtime Security backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "anthropic>=0.40.0",
    "pyjwt[crypto]>=2.9.0",
    "stripe>=11.0.0",
    "spacy>=3.8.0",
    "scikit-learn>=1.6.0",
    "sse-starlette>=2.1.0",
    "svix>=1.80.0",
    "watchdog>=6.0.0",
    "sentry-sdk[fastapi]>=2.20.0",
    "prometheus-client>=0.21.0",
    "weasyprint>=63.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
# B008: FastAPI uses Depends()/Query() in argument defaults — that's the canonical pattern
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# N803: test mocks use the convention `MockClassName` for patched class injection
# E501: tests often contain long fixture strings (prompts, payloads) that don't benefit from wrapping
"tests/**" = ["N803", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
