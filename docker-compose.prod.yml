# Production Docker Compose — use with: docker compose -f docker-compose.prod.yml up -d
# Requires .env file with all secrets configured (see .env.example)

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-parry}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parry}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Conditionally apply --requirepass. Redis 7.4+ refuses to boot when
    # --requirepass is given an empty argument, so we wrap the command
    # in a shell that only adds the flag when REDIS_PASSWORD is set.
    # Keeps the password optional (acceptable on a private docker
    # network) without breaking on newer Redis releases.
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
      exec redis-server --requirepass "$$REDIS_PASSWORD";
      else exec redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    restart: always
    healthcheck:
      # Same conditional logic — redis-cli needs -a only when AUTH is set.
      test:
        - CMD-SHELL
        - 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping; else redis-cli ping; fi'
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parry}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-parry}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parry}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-parry}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/2
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parry}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-parry}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/2
    command: celery -A app.workers.celery_app beat --loglevel=warning
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    mem_limit: 256m
    cpus: 0.25

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      # VITE_* env vars are inlined into the JS bundle at build time. We
      # forward them as build args so the repo-root .env is the single
      # source of truth — no dashboard/.env file required.
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY in .env}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_STRIPE_PRICE_GROWTH: ${VITE_STRIPE_PRICE_GROWTH:-}
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    cpus: 0.25

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (e.g. parry.yourdomain.com)}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env for Let's Encrypt notices}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dashboard
      - backend

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
