[project]
name = "parry"
version = "0.1.0"
description = "Parry SDK — AI Agent Runtime Security"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
]

[project.optional-dependencies]
openai = ["openai>=1.50.0"]
anthropic = ["anthropic>=0.40.0"]
langchain = ["langchain-core>=0.3.0"]
crewai = ["crewai>=0.28.0"]
autogen = ["pyautogen>=0.2.0"]
llamaindex = ["llama-index-core>=0.10.0"]
pydantic-ai = ["pydantic-ai>=0.2.0"]
mcp = ["mcp>=1.0.0"]
all = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "langchain-core>=0.3.0",
    "crewai>=0.28.0",
    "pyautogen>=0.2.0",
    "llama-index-core>=0.10.0",
    "pydantic-ai>=0.2.0",
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# N803: unittest.mock.patch convention uses CamelCase for the injected
# mock class argument (MockOpenAI, MockAnthropic). Fighting the
# convention just makes the tests noisier.
"tests/**" = ["N803"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["parry"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
